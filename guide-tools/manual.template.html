<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>世界状态使用手册</title>
<style>
:root{color-scheme:light;--ink:#203734;--line:#bfcac4;--accent:#126b61}*{box-sizing:border-box}body{margin:0;background:#f5f5ee;color:var(--ink);font:16px/1.8 system-ui,sans-serif}main{max-width:1120px;margin:auto;display:grid;grid-template-columns:minmax(12em,1fr) 3fr;gap:4vw;padding:5vh 4vw}header{grid-column:1/-1;border-bottom:2px solid var(--ink)}h1,h2{font-family:Georgia,"Noto Serif CJK SC",serif;line-height:1.3}h1{font-size:clamp(2rem,5vw,3.5rem)}aside{align-self:start;position:sticky;top:1em}nav a{display:block;color:var(--accent);padding:.5rem 0}input{width:100%;padding:.55em;border:1px solid var(--line);background:white}h2{font-size:1.6em}article{border-bottom:1px solid var(--line);padding:.3em 0 1.7em;scroll-margin-top:1em}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e6ece6;padding:1em}article:last-child{border:none}#count{min-height:1.5em}a:focus-visible,input:focus-visible{outline:3px solid var(--accent)}@media(max-width:700px){main{display:block}aside{position:static}nav a{display:inline-block;margin-right:1em}}@media print{aside{display:none}main{display:block}article[hidden]{display:block}}
</style>
<main><header><h1>世界状态使用手册</h1></header><aside><label for="search">搜索手册</label><input type="search" id="search" autocomplete="off"><nav aria-label="章节">{{nav}}</nav><p id="count" role="status"></p></aside><section>{{chapters}}</section></main>
<script>
const search=document.querySelector('#search'), chapters=Array.from(document.querySelectorAll('article')), links=Array.from(document.querySelectorAll('nav a'));
function filter(){const term=search.value.trim().toLowerCase();let matches=0;for(const [i,chapter] of chapters.entries()){const visible=chapter.textContent.toLowerCase().includes(term);chapter.hidden=!visible;links[i].hidden=!visible;links[i].style.display=visible?'':'none';if(visible)matches++;}document.querySelector('#count').textContent=term?(matches?'找到 '+matches+' 章':'没有找到相关章节'):'';}
search.addEventListener('input',filter);
</script></html>
